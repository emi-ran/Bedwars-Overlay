name: Build and publish Windows release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-2022

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Restore signing certificate
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64)) {
            throw "GitHub Actions secret WINDOWS_SIGNING_CERTIFICATE_BASE64 is not configured."
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "Bedwars-Overlay.pfx"
          $certificateBytes = [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64)
          [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          "SIGNING_CERTIFICATE_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Remove-Item Env:SIGNING_CERTIFICATE_BASE64
          Remove-Variable certificateBytes

      - name: Build signed release packages
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:SIGNING_CERTIFICATE_PASSWORD)) {
            throw "GitHub Actions secret WINDOWS_SIGNING_CERTIFICATE_PASSWORD is not configured."
          }

          [xml]$project = Get-Content .\BedwarsOverlay.App\BedwarsOverlay.App.csproj
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          $version = if ($env:RELEASE_TAG) { $env:RELEASE_TAG -replace '^v', '' } else { $projectVersion }
          if ($version -ne $projectVersion) { throw "Release tag and project version must match." }
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Release tag must use a version such as v1.4.0; received '$env:RELEASE_TAG'."
          }

          .\scripts\publish-release.ps1 `
            -Version $version `
            -Sign `
            -CertificatePath $env:SIGNING_CERTIFICATE_PATH

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Save signed packages
        uses: actions/upload-artifact@v4
        with:
          name: signed-windows-packages
          path: |
            publish/BedwarsOverlay-*-win-x64.zip
            publish/BedwarsOverlaySetup-*-win-x64.exe
          if-no-files-found: error

      - name: Attach packages to the GitHub release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $artifacts = @(
            Get-ChildItem -LiteralPath .\publish -File |
              Where-Object { $_.Name -match '^BedwarsOverlay(-\d+\.\d+\.\d+.*-win-x64\.zip|Setup-\d+\.\d+\.\d+.*-win-x64\.exe)$' } |
              ForEach-Object { $_.FullName }
          )

          if ($artifacts.Count -ne 2) {
            throw "Expected the portable ZIP and setup EXE in .\publish; found $($artifacts.Count) artifact(s)."
          }

          gh release upload $env:RELEASE_TAG $artifacts --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
